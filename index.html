<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ساعات الشغل | كيرلس سامح عيد</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="bg"><i></i><i></i><i></i></div>
<div class="wrap">
  <div class="hero">
    <div class="who"><div class="av">ك</div><div><small>الموظف</small><h1>كيرلس سامح عيد</h1></div></div>
    <div class="chip" id="range"></div>
  </div>

  <div class="card" style="animation-delay:.1s">
    <div class="ringbox">
      <div class="ring">
        <svg viewBox="0 0 120 120"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6d5efc"/><stop offset="1" stop-color="#14b8a6"/></linearGradient></defs><circle class="tr" cx="60" cy="60" r="52"/><circle class="pg" id="pg" cx="60" cy="60" r="52"/></svg>
        <b id="pct">0%</b>
      </div>
      <div class="res" id="res"></div>
    </div>
    <div class="grid">
      <div class="st"><span>الساعات المطلوبة</span><b id="req">0</b></div>
      <div class="st"><span>اللي اشتغلته (بالإجازات)</span><b id="work">0</b></div>
      <div class="st"><span>الإجازات</span><b id="lvu">0</b></div>
      <div class="st"><span>الأيام المسجلة</span><b id="rec">0</b></div>
    </div>
    <div class="warn" id="warn"></div>
  </div>

  <div class="card" style="animation-delay:.2s">
    <details>
      <summary>الإعدادات</summary>
      <div class="set">
        <label>الفترة بتبدأ في شهر<input type="month" id="month"></label>
        <label>ساعات اليوم<input type="number" id="target" min="1" step="0.5"></label>
        <label>أيام الإجازة<input type="number" id="allow" min="0"></label>
        <label>يوم بداية الشهر<input type="number" id="start" min="1" max="28"></label>
        <label class="ck"><input type="checkbox" id="incl">احسب يوم النهاية كمان (يعني تقفل 26 شامل)</label>
      </div>
    </details>
  </div>

  <div class="card" id="days" style="animation-delay:.3s"></div>
</div>
<script src="script.js"></script>
</body>
</html>
