<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ساعات الشغل | كيرلس سامح عيد</title>
<style>
:root{--bg:#eef1f8;--card:rgba(255,255,255,.75);--tx:#14182a;--mut:#667091;--bd:rgba(20,24,42,.08);--in:rgba(20,24,42,.05);--ac:#6d5efc;--ac2:#14b8a6;--ok:#10b981;--bad:#f43f5e;--lv:#f59e0b;--sh:0 10px 30px rgba(40,50,100,.10);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0b0e1a;--card:rgba(255,255,255,.06);--tx:#eef0ff;--mut:#9aa3c7;--bd:rgba(255,255,255,.10);--in:rgba(255,255,255,.07);--sh:0 10px 30px rgba(0,0,0,.4)}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0b0e1a;--card:rgba(255,255,255,.06);--tx:#eef0ff;--mut:#9aa3c7;--bd:rgba(255,255,255,.10);--in:rgba(255,255,255,.07);--sh:0 10px 30px rgba(0,0,0,.4)}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Cairo","Tajawal",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;padding:14px;overflow-x:hidden}
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden}
.bg i{position:absolute;width:340px;height:340px;border-radius:50%;filter:blur(70px);opacity:.45;animation:fl 14s ease-in-out infinite alternate}
.bg i:nth-child(1){background:var(--ac);top:-90px;right:-80px}
.bg i:nth-child(2){background:var(--ac2);bottom:-100px;left:-90px;animation-delay:-5s}
.bg i:nth-child(3){background:#f472b6;top:40%;left:30%;width:220px;height:220px;opacity:.25;animation-delay:-9s}
@keyframes fl{to{transform:translate(40px,60px) scale(1.15)}}
.wrap{max-width:560px;margin-inline:auto}
.hero{position:relative;border-radius:24px;padding:20px;color:#fff;background:linear-gradient(135deg,var(--ac),var(--ac2));box-shadow:0 18px 40px rgba(109,94,252,.35);overflow:hidden;animation:up .6s both}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.28) 50%,transparent 70%);transform:translateX(-120%);animation:shine 5s 1s infinite}
@keyframes shine{to{transform:translateX(120%)}}
.who{display:flex;align-items:center;gap:14px}
.av{width:58px;height:58px;border-radius:50%;background:rgba(255,255,255,.22);display:grid;place-items:center;font-size:26px;font-weight:800;position:relative;flex:none}
.av::before{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid rgba(255,255,255,.55);animation:pulse 2.4s infinite}
@keyframes pulse{0%{transform:scale(.9);opacity:1}100%{transform:scale(1.35);opacity:0}}
.who small{opacity:.8;font-size:12px;letter-spacing:.5px}
.who h1{margin:0;font-size:21px;line-height:1.3}
.chip{display:inline-block;margin-top:14px;background:rgba(255,255,255,.2);backdrop-filter:blur(6px);padding:6px 12px;border-radius:999px;font-size:13px}
.card{background:var(--card);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--bd);border-radius:20px;padding:16px;margin-top:14px;box-shadow:var(--sh);animation:up .6s both}
@keyframes up{from{opacity:0;transform:translateY(18px)}}
.ringbox{display:flex;align-items:center;gap:16px}
.ring{position:relative;width:128px;height:128px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:11;stroke-linecap:round}
.ring .tr{stroke:var(--in)}
.ring .pg{stroke:url(#g);stroke-dasharray:327;stroke-dashoffset:327;transition:stroke-dashoffset 1.2s cubic-bezier(.2,.8,.2,1)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:26px}
.res{flex:1;font-weight:800;font-size:19px;line-height:1.5}
.res small{display:block;color:var(--mut);font-weight:500;font-size:13px}
.res.ok{color:var(--ok)}.res.bad{color:var(--bad)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.st{background:var(--in);border-radius:14px;padding:12px;transition:transform .25s}
.st:hover{transform:translateY(-3px)}
.st span{font-size:12px;color:var(--mut)}
.st b{display:block;font-size:22px;margin-top:2px}
.warn{color:var(--bad);font-size:13px;margin-top:10px}
details summary{cursor:pointer;font-weight:700;list-style:none;display:flex;justify-content:space-between}
details summary::after{content:"⚙️"}
.set{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
label{font-size:12px;color:var(--mut);display:flex;flex-direction:column;gap:4px;flex:1;min-width:110px}
label.ck{flex-direction:row;align-items:center;gap:8px;min-width:100%}
input{font:inherit;color:var(--tx);background:var(--in);border:1px solid transparent;border-radius:12px;padding:9px;width:100%;transition:border .2s,box-shadow .2s}
input:focus{outline:0;border-color:var(--ac);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 25%,transparent)}
input[type=checkbox]{width:18px;height:18px;padding:0}
.day{display:flex;align-items:center;gap:10px;padding:10px 8px;border-radius:14px;animation:up .45s both;transition:background .25s}
.day:hover{background:var(--in)}
.day.today{background:color-mix(in srgb,var(--ac) 14%,transparent);box-shadow:inset 0 0 0 1.5px var(--ac)}
.dt{width:54px;text-align:center;flex:none}
.dt b{display:block;font-size:20px;line-height:1}
.dt small{font-size:11px;color:var(--mut)}
.mid{flex:1;min-width:0}
.mid input{text-align:center;font-weight:700}
.bar{height:5px;border-radius:9px;background:var(--in);margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:9px;background:linear-gradient(90deg,var(--ac),var(--ac2));transition:width .5s cubic-bezier(.2,.8,.2,1)}
.bar i.lv{background:var(--lv)}
button{font:inherit;font-size:13px;border:0;background:var(--in);color:var(--tx);border-radius:12px;padding:9px 11px;cursor:pointer;transition:transform .15s,background .2s;flex:none}
button:active{transform:scale(.92)}
button.full{color:var(--ok);font-weight:700}
button.on{background:var(--lv);color:#1b1300;font-weight:800}
.conf{position:fixed;top:-12px;width:9px;height:14px;border-radius:2px;z-index:9;pointer-events:none;animation:fall 2.2s ease-in forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg);opacity:.8}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="bg"><i></i><i></i><i></i></div>
<div class="wrap">
  <div class="hero">
    <div class="who"><div class="av">ك</div><div><small>الموظف</small><h1>كيرلس سامح عيد</h1></div></div>
    <div class="chip" id="range"></div>
  </div>

  <div class="card" style="animation-delay:.1s">
    <div class="ringbox">
      <div class="ring">
        <svg viewBox="0 0 120 120"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6d5efc"/><stop offset="1" stop-color="#14b8a6"/></linearGradient></defs><circle class="tr" cx="60" cy="60" r="52"/><circle class="pg" id="pg" cx="60" cy="60" r="52"/></svg>
        <b id="pct">0%</b>
      </div>
      <div class="res" id="res"></div>
    </div>
    <div class="grid">
      <div class="st"><span>الساعات المطلوبة</span><b id="req">0</b></div>
      <div class="st"><span>اللي اشتغلته (بالإجازات)</span><b id="work">0</b></div>
      <div class="st"><span>الإجازات</span><b id="lvu">0</b></div>
      <div class="st"><span>الأيام المسجلة</span><b id="rec">0</b></div>
    </div>
    <div class="warn" id="warn"></div>
  </div>

  <div class="card" style="animation-delay:.2s">
    <details>
      <summary>الإعدادات</summary>
      <div class="set">
        <label>الفترة بتبدأ في شهر<input type="month" id="month"></label>
        <label>ساعات اليوم<input type="number" id="target" min="1" step="0.5"></label>
        <label>أيام الإجازة<input type="number" id="allow" min="0"></label>
        <label>يوم بداية الشهر<input type="number" id="start" min="1" max="28"></label>
        <label class="ck"><input type="checkbox" id="incl">احسب يوم النهاية كمان (يعني تقفل 26 شامل)</label>
      </div>
    </details>
  </div>

  <div class="card" id="days" style="animation-delay:.3s"></div>
</div>
<script>
const $=id=>document.getElementById(id);
let data={},cfg={},prev={};
const wd=["الأحد","الاثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"];
const f=n=>(Math.round(n*100)/100).toString();
function load(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
const K=()=>"p2:"+$("month").value+":"+cfg.start+":"+(cfg.incl?1:0);
function count(el,to,fmt){
  const from=prev[el.id]||0;prev[el.id]=to;const t0=performance.now();
  (function s(t){const p=Math.min((t-t0)/700,1),e=1-Math.pow(1-p,3);el.textContent=fmt(from+(to-from)*e);if(p<1)requestAnimationFrame(s)})(t0);
}
function burst(){
  const c=["#6d5efc","#14b8a6","#f59e0b","#f472b6","#10b981"];
  for(let i=0;i<34;i++){const s=document.createElement("span");s.className="conf";
    s.style.left=Math.random()*100+"vw";s.style.background=c[i%5];s.style.animationDelay=Math.random()*.5+"s";
    document.body.append(s);setTimeout(()=>s.remove(),3000)}
}
function init(){
  cfg=Object.assign({target:8,allow:4,start:26,incl:false},load("cfg2",{}));
  const n=new Date();let sy=n.getFullYear(),sm=n.getMonth()+1;
  if(n.getDate()<cfg.start){sm--;if(!sm){sm=12;sy--}}
  $("month").value=sy+"-"+String(sm).padStart(2,"0");
  $("target").value=cfg.target;$("allow").value=cfg.allow;$("start").value=cfg.start;$("incl").checked=cfg.incl;
  $("month").onchange=()=>render(true);
  const ch=()=>{cfg.target=+$("target").value||8;cfg.allow=+$("allow").value||0;cfg.start=Math.min(28,Math.max(1,+$("start").value||1));cfg.incl=$("incl").checked;save("cfg2",cfg);render(true)};
  ["target","allow","start","incl"].forEach(i=>$(i).onchange=ch);
  render(true);
  setTimeout(()=>{const t=document.querySelector(".day.today");if(t)t.scrollIntoView({block:"center"})},900);
}
let dim=30;
function render(full){
  data=load(K(),{});
  const [y,m]=$("month").value.split("-").map(Number),sd=cfg.start;
  dim=Math.round((new Date(y,m,sd)-new Date(y,m-1,sd))/864e5)+(cfg.incl?1:0);
  const fm=d=>d.toLocaleDateString("ar-EG",{day:"numeric",month:"long"});
  $("range").textContent="📅 من "+fm(new Date(y,m-1,sd))+" إلى "+fm(new Date(y,m-1,sd+dim-1))+" · "+dim+" يوم";
  const box=$("days"),now=new Date();box.innerHTML="";
  for(let i=0;i<dim;i++){
    const dt=new Date(y,m-1,sd+i),d=i+1,e=data[d]||{},el=document.createElement("div");
    el.className="day"+(dt.toDateString()==now.toDateString()?" today":"");
    el.style.animationDelay=Math.min(i*18,500)+"ms";
    el.innerHTML=`<div class="dt"><b>${dt.getDate()}</b><small>${wd[dt.getDay()]}</small></div>`;
    const mid=document.createElement("div");mid.className="mid";
    const inp=document.createElement("input");inp.type="number";inp.step="0.25";inp.min="0";inp.inputMode="decimal";
    inp.placeholder=e.l?"إجازة 🌴":"ساعات";inp.value=e.l?"":(e.h??"");inp.disabled=!!e.l;
    const bar=document.createElement("div");bar.className="bar";const bi=document.createElement("i");bar.append(bi);
    const setBar=()=>{const l=data[d]&&data[d].l;bi.className=l?"lv":"";bi.style.width=l?"100%":Math.min(100,((data[d]&&data[d].h)||0)/cfg.target*100)+"%"};
    setTimeout(setBar,60);
    inp.oninput=()=>{if(inp.value==="")delete data[d];else data[d]={h:+inp.value};save(K(),data);setBar();stats()};
    mid.append(inp,bar);
    const full=document.createElement("button");full.className="full";full.textContent="✓ "+cfg.target;
    full.onclick=()=>{data[d]={h:cfg.target};save(K(),data);inp.value=cfg.target;setBar();stats()};
    const b=document.createElement("button");b.textContent=e.l?"إجازة ✓":"إجازة";b.className=e.l?"on":"";
    b.onclick=()=>{if(data[d]&&data[d].l)delete data[d];else data[d]={l:1};save(K(),data);render()};
    el.append(mid,full,b);box.append(el);
  }
  stats();
}
let wasPos=false;
function stats(){
  const t=cfg.target;let w=0,lv=0,rec=0;
  Object.values(data).forEach(e=>{if(e.l){lv++;rec++}else if(e.h!==undefined){w+=e.h;rec++}});
  const paid=Math.min(lv,cfg.allow),req=dim*t,total=w+paid*t,diff=total-req,pct=req?total/req:0;
  count($("req"),req,v=>f(v)+" س");count($("work"),total,v=>f(v)+" س");
  $("lvu").textContent=lv+" / "+cfg.allow;$("rec").textContent=rec+" / "+dim;
  count($("pct"),Math.round(pct*100),v=>Math.round(v)+"%");
  $("pg").style.strokeDashoffset=327*(1-Math.min(pct,1));
  const r=$("res"),pos=diff>0.01;
  if(Math.abs(diff)<0.01){r.className="res";r.innerHTML="ساعاتك مظبوطة ✅<small>مفيش عجز ولا زيادة</small>"}
  else if(pos){r.className="res ok";r.innerHTML="ساعات إضافية 🎉<small>+"+f(diff)+" ساعة زيادة عن المطلوب</small>"}
  else{r.className="res bad";r.innerHTML="عجز ⏳<small>"+f(-diff)+" ساعة ناقصة عن المطلوب</small>"}
  if(pos&&!wasPos&&rec>0)burst();wasPos=pos;
  $("warn").textContent=lv>cfg.allow?"⚠️ أخدت "+(lv-cfg.allow)+" إجازة زيادة عن المسموح ومش محسوبة من الساعات.":"";
}
init();
</script>
</body>
</html>
